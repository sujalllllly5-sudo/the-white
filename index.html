<!DOCTYPE html>
<html lang="en">
<head>

  <!-- ============================================================
       PAGE SETUP : meta tags + fonts + stylesheet
       ============================================================ -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sujal Dehariya — Portfolio</title>
  <link rel="stylesheet" href="style.css">

  <!-- FONTS : Fraunces (display serif) + Inter (body) — the
       editorial pairing expensive sites use. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <noscript><style>
    #intro { display: none !important; }
    body:not(.entered) .hero-card,
    body:not(.entered) .hero-card > * { opacity: 1 !important; transform: none !important; }
  </style></noscript>

</head>
<body>

  <!-- ============================================================
       INTRO : "SUJAL" hovers scattered over matte black. Each
       swipe up pulls the letters closer together and reveals one
       identity line. On the 4th swipe the letters fly off and
       the site is revealed. Logic: app.js (INTRO SEQUENCE),
       styles: style.css block 15. Auto-hidden if JS is disabled.
       ============================================================ -->
  <div id="intro" aria-hidden="true">
    <div class="intro-title">
      <span class="lt"><span class="lt-inner">S</span></span>
      <span class="lt"><span class="lt-inner">U</span></span>
      <span class="lt"><span class="lt-inner">J</span></span>
      <span class="lt"><span class="lt-inner">A</span></span>
      <span class="lt"><span class="lt-inner">L</span></span>
    </div>
    <div class="intro-lines">
      <span class="intro-line">Web Developer</span>
      <span class="intro-line">Manga Artist</span>
      <span class="intro-line">Japan Bound</span>
    </div>
    <div class="intro-dots">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
    <p class="intro-hint">swipe up &#8593;</p>
  </div>

  <!-- ============================================================
       BACKGROUND SILHOUETTE : two layered warm dunes along the
       bottom edge for quiet depth, with a sun-sky haze between.
       Pure decoration — reshape the paths or tweak fills in
       style.css block 3d (.bg-silhouette).
       ============================================================ -->
  <div class="bg-silhouette" aria-hidden="true">
    <svg class="ridge ridge-far" viewBox="0 0 1440 220" preserveAspectRatio="none">
      <path d="M0,140 C180,90 320,150 480,120 C660,86 780,152 960,128 C1140,106 1290,150 1440,118 L1440,220 L0,220 Z"/>
    </svg>
    <svg class="ridge ridge-near" viewBox="0 0 1440 160" preserveAspectRatio="none">
      <path d="M0,112 C200,62 360,126 560,98 C760,70 900,128 1100,102 C1260,82 1360,114 1440,94 L1440,160 L0,160 Z"/>
    </svg>
  </div>

  <!-- ============================================================
       NAVBAR : logo + section links + button that opens the AI chat
       ============================================================ -->
  <nav class="nav">
    <a href="#top" class="nav-logo">sujal<span>.dev</span></a>
    <div class="nav-links">
      <a href="#about">About</a>
      <a href="#projects">Projects</a>
      <a href="#skills">Skills</a>
      <a href="#contact">Contact</a>
      <button id="open-chat" class="btn btn-solid btn-small">Ask AI</button>
    </div>
  </nav>

  <!-- ============================================================
       HERO : intro text. Name + role come from SITE config in app.js
       ============================================================ -->
  <header id="top" class="hero">
    <!-- GLASS CARD : liquid-glass panel behind the landing text.
         Styling lives in style.css block 7 (.hero-card). -->
    <div class="hero-card">
      <p class="eyebrow">Portfolio</p>
      <h1 id="hero-name">Your Name</h1>
      <p id="hero-tagline" class="hero-tagline"></p>
      <p id="hero-bio" class="hero-bio"></p>
      <div class="hero-actions">
        <a href="#projects" class="btn btn-solid">View Projects</a>
        <button id="hero-chat" class="btn btn-outline">Ask the AI</button>
      </div>
    </div>
  </header>

  <!-- ============================================================
       ABOUT : quick fact cards, auto-generated from SITE.about in app.js
       ============================================================ -->
  <section id="about" class="section">
    <h2>About</h2>
    <div id="about-grid" class="about-grid" data-reveal></div>
  </section>

  <!-- ============================================================
       PROJECTS : cards are auto-generated from SITE.projects in app.js
       ============================================================ -->
  <section id="projects" class="section">
    <h2>Projects</h2>
    <div id="project-grid" class="project-grid" data-reveal></div>
  </section>

  <!-- ============================================================
       SKILLS : chips are auto-generated from SITE.skills in app.js
       ============================================================ -->
  <section id="skills" class="section">
    <h2>Skills</h2>
    <div id="skill-list" class="skill-list" data-reveal></div>
  </section>

  <!-- ============================================================
       CONTACT : simple links, filled from SITE config in app.js
       ============================================================ -->
  <section id="contact" class="section">
    <h2>Contact</h2>
    <div id="contact-links" class="contact-links" data-reveal></div>
  </section>

  <!-- ============================================================
       FOOTER
       ============================================================ -->
  <footer class="footer">
    <p id="footer-text"></p>
  </footer>

  <!-- ============================================================
       AI COMPANION : 3D hovering Zoro-style assistant.
       Tap to open chat. It answers questions AND navigates the
       page ("go to projects"). Styles: style.css block 15.
       ============================================================ -->
  <button id="chat-toggle" class="ai-companion" aria-label="Open AI assistant">
    <span class="companion-hint">Ask me ✦</span>
    <span class="zoro">
      <span class="zoro-swords"></span>
      <span class="zoro-head"></span>
      <span class="zoro-eye left"></span>
      <span class="zoro-eye right"></span>
      <span class="zoro-scar"></span>
      <span class="zoro-body"></span>
    </span>
    <span class="zoro-shadow"></span>
  </button>

  <div id="chat-panel" class="chat-panel" role="dialog" aria-label="AI assistant">
    <div class="chat-header">
      <span class="chat-dot"></span>
      <div>
        <strong>AI Assistant</strong><br>
        <small id="chat-status">demo mode</small>
      </div>
    </div>
    <div class="chat-nav" aria-label="Page navigation">
      <button type="button" data-scroll="#top">Home</button>
      <button type="button" data-scroll="#about">About</button>
      <button type="button" data-scroll="#projects">Projects</button>
      <button type="button" data-scroll="#skills">Skills</button>
      <button type="button" data-scroll="#contact">Contact</button>
    </div>
    <div id="chat-messages" class="chat-messages"></div>
    <form id="chat-form" class="chat-form">
      <input id="chat-input" type="text" placeholder="Ask about Sujal..." autocomplete="off">
      <button id="chat-send" type="submit" aria-label="Send">&#10148;</button>
    </form>
  </div>

  <!-- ============================================================
       SCRIPTS
       ============================================================ -->
  <script src="app.js"></script>

</body>
</html>
